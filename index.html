<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Happy Birthday Juan Pablo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Black+Ops+One&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <svg class="asset-defs" aria-hidden="true" focusable="false">
      <defs>
        <symbol id="food-taco" viewBox="0 0 260 170">
          <path
            d="M42 122c10-54 42-92 88-92s78 38 88 92c-26 18-60 26-88 26s-62-8-88-26Z"
            fill="#f3d18b"
          />
          <path
            d="M54 118c18-34 46-56 76-56s58 22 76 56c-20 12-48 20-76 20s-56-8-76-20Z"
            fill="#e68b40"
          />
          <path
            d="M72 104c18-10 38-16 58-16s40 6 58 16c-12 18-34 30-58 30s-46-12-58-30Z"
            fill="#b85634"
          />
          <circle cx="94" cy="100" r="8" fill="#5d9b46" />
          <circle cx="118" cy="92" r="7" fill="#5d9b46" />
          <circle cx="148" cy="96" r="7" fill="#5d9b46" />
          <circle cx="170" cy="104" r="8" fill="#5d9b46" />
          <circle cx="108" cy="108" r="5" fill="#efe6d5" />
          <circle cx="136" cy="104" r="5" fill="#efe6d5" />
          <circle cx="158" cy="112" r="5" fill="#efe6d5" />
          <path d="M128 66 146 42l16 6-10 22Z" fill="#f0cf5b" />
        </symbol>

        <symbol id="food-elote" viewBox="0 0 180 260">
          <path
            d="M64 208 44 248l30-16 16 18 16-18 30 16-20-40Z"
            fill="#5e8f43"
          />
          <rect x="72" y="26" width="36" height="182" rx="18" fill="#f3d750" />
          <g fill="#e6bf34">
            <circle cx="84" cy="48" r="8" />
            <circle cx="96" cy="48" r="8" />
            <circle cx="84" cy="68" r="8" />
            <circle cx="96" cy="68" r="8" />
            <circle cx="84" cy="88" r="8" />
            <circle cx="96" cy="88" r="8" />
            <circle cx="84" cy="108" r="8" />
            <circle cx="96" cy="108" r="8" />
            <circle cx="84" cy="128" r="8" />
            <circle cx="96" cy="128" r="8" />
            <circle cx="84" cy="148" r="8" />
            <circle cx="96" cy="148" r="8" />
            <circle cx="84" cy="168" r="8" />
            <circle cx="96" cy="168" r="8" />
          </g>
          <path
            d="M70 52c12 10 28 10 40 0M70 96c12 10 28 10 40 0M70 140c12 10 28 10 40 0"
            fill="none"
            stroke="#f8f1de"
            stroke-width="8"
            stroke-linecap="round"
          />
          <circle cx="76" cy="88" r="3" fill="#bd3f2b" />
          <circle cx="102" cy="120" r="3" fill="#bd3f2b" />
          <circle cx="88" cy="156" r="3" fill="#bd3f2b" />
          <rect x="84" y="208" width="12" height="38" rx="6" fill="#d7a26e" />
        </symbol>

        <symbol id="food-concha" viewBox="0 0 220 180">
          <ellipse cx="110" cy="108" rx="82" ry="54" fill="#d78f5e" />
          <path
            d="M40 112c0-42 30-74 70-74s70 32 70 74c-16 10-44 16-70 16s-54-6-70-16Z"
            fill="#f4d5c2"
          />
          <path
            d="M68 86c28-18 56-18 84 0M56 104c36-18 72-18 108 0M58 126c34-14 70-14 104 0"
            fill="none"
            stroke="#f0b89d"
            stroke-width="8"
            stroke-linecap="round"
          />
          <path d="M82 72c0 18-10 34-22 48M138 72c0 18 10 34 22 48" fill="none" stroke="#f0b89d" stroke-width="8" stroke-linecap="round" />
        </symbol>

        <symbol id="food-tamale" viewBox="0 0 180 260">
          <path
            d="M24 204c14-92 50-160 66-160s52 68 66 160c-14 10-42 20-66 20s-52-10-66-20Z"
            fill="#86ad61"
          />
          <path
            d="M44 190c10-58 30-108 46-108s36 50 46 108c-10 8-30 14-46 14s-36-6-46-14Z"
            fill="#b8c97c"
          />
          <path
            d="M62 156c8-22 18-36 28-36s20 14 28 36c-6 6-18 10-28 10s-22-4-28-10Z"
            fill="#f0d7a3"
          />
          <path
            d="M54 120c12 28 30 46 54 58M126 120c-12 28-30 46-54 58"
            fill="none"
            stroke="#5f7d42"
            stroke-width="6"
            stroke-linecap="round"
          />
          <path d="M90 206v32" fill="none" stroke="#d8b686" stroke-width="6" stroke-linecap="round" />
        </symbol>
      </defs>
    </svg>

    <main class="app" id="app">
      <section class="scene" aria-live="polite">
        <div class="flag-layer" aria-hidden="true">
          <img class="flag-art" src="mexico-flag.svg" alt="" />
          <span class="flag-wave flag-wave-a"></span>
          <span class="flag-wave flag-wave-b"></span>
          <span class="flag-shadow"></span>
        </div>

        <div class="fireworks" aria-hidden="true">
          <span class="rocket rocket-left rocket-a"></span>
          <span class="rocket rocket-left rocket-b"></span>
          <span class="rocket rocket-left rocket-c"></span>
          <span class="rocket rocket-left rocket-d"></span>
          <span class="rocket rocket-right rocket-a"></span>
          <span class="rocket rocket-right rocket-b"></span>
          <span class="rocket rocket-right rocket-c"></span>
          <span class="rocket rocket-right rocket-d"></span>
        </div>

        <div class="feast" aria-hidden="true">
          <div class="food food-left food-a">
            <svg class="food-svg" viewBox="0 0 260 170">
              <use href="#food-taco"></use>
            </svg>
          </div>
          <div class="food food-left food-b">
            <svg class="food-svg" viewBox="0 0 180 260">
              <use href="#food-tamale"></use>
            </svg>
          </div>
          <div class="food food-left food-c">
            <svg class="food-svg" viewBox="0 0 180 260">
              <use href="#food-elote"></use>
            </svg>
          </div>
          <div class="food food-left food-d">
            <svg class="food-svg" viewBox="0 0 220 180">
              <use href="#food-concha"></use>
            </svg>
          </div>
          <div class="food food-right food-a">
            <svg class="food-svg" viewBox="0 0 220 180">
              <use href="#food-concha"></use>
            </svg>
          </div>
          <div class="food food-right food-b">
            <svg class="food-svg" viewBox="0 0 260 170">
              <use href="#food-taco"></use>
            </svg>
          </div>
          <div class="food food-right food-c">
            <svg class="food-svg" viewBox="0 0 180 260">
              <use href="#food-elote"></use>
            </svg>
          </div>
          <div class="food food-right food-d">
            <svg class="food-svg" viewBox="0 0 180 260">
              <use href="#food-tamale"></use>
            </svg>
          </div>
        </div>

        <div class="coins" aria-hidden="true">
          <span class="coin coin-1"></span>
          <span class="coin coin-2"></span>
          <span class="coin coin-3"></span>
          <span class="coin coin-4"></span>
          <span class="coin coin-5"></span>
          <span class="coin coin-6"></span>
          <span class="coin coin-7"></span>
          <span class="coin coin-8"></span>
          <span class="coin coin-9"></span>
          <span class="coin coin-10"></span>
          <span class="coin coin-11"></span>
          <span class="coin coin-12"></span>
        </div>

        <div class="content">
          <button
            class="chest-button"
            id="chestButton"
            type="button"
            aria-label="Open the treasure chest"
            aria-pressed="false"
          >
            <svg class="chest-svg" viewBox="0 0 520 420" aria-hidden="true">
              <defs>
                <linearGradient id="woodMain" x1="0%" y1="0%" x2="0%" y2="100%">
                  <stop offset="0%" stop-color="#9b5d31" />
                  <stop offset="100%" stop-color="#5e3116" />
                </linearGradient>
                <linearGradient id="woodDark" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#7b4523" />
                  <stop offset="100%" stop-color="#3f1e0d" />
                </linearGradient>
                <linearGradient id="brass" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#f9dc8c" />
                  <stop offset="100%" stop-color="#b07d17" />
                </linearGradient>
              </defs>

              <ellipse class="chest-shadow" cx="260" cy="376" rx="168" ry="26" />
              <ellipse class="chest-mouth" cx="260" cy="202" rx="148" ry="20" />

              <g class="chest-base">
                <rect class="chest-front" x="74" y="186" width="372" height="158" rx="28" />
                <rect class="chest-rim" x="88" y="178" width="344" height="30" rx="14" />
                <rect class="chest-band" x="114" y="186" width="28" height="158" rx="10" />
                <rect class="chest-band" x="246" y="186" width="28" height="158" rx="10" />
                <rect class="chest-band" x="378" y="186" width="28" height="158" rx="10" />
                <rect class="chest-lock" x="230" y="212" width="60" height="82" rx="18" />
                <rect class="chest-lock-slot" x="246" y="230" width="28" height="24" rx="8" />
              </g>

              <g class="coin-peek">
                <circle cx="200" cy="196" r="18" />
                <circle cx="232" cy="188" r="16" />
                <circle cx="266" cy="194" r="18" />
                <circle cx="300" cy="186" r="16" />
                <circle cx="328" cy="196" r="18" />
              </g>

              <g class="chest-lid">
                <path
                  class="lid-main"
                  d="M76 196v-48c0-46 38-84 84-84h200c46 0 84 38 84 84v48Z"
                />
                <path
                  class="lid-highlight"
                  d="M96 186v-38c0-34 28-62 64-62h200c36 0 64 28 64 62v38Z"
                />
                <rect class="lid-band" x="116" y="100" width="28" height="96" rx="10" />
                <rect class="lid-band" x="246" y="88" width="28" height="108" rx="10" />
                <rect class="lid-band" x="376" y="100" width="28" height="96" rx="10" />
                <rect class="lid-lock" x="230" y="164" width="60" height="32" rx="14" />
              </g>
            </svg>
          </button>

          <p class="hint" id="hint">click the chest</p>
          <h1 class="message" id="message">happy birthday juan pablo</h1>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
