<!DOCTYPE html>
<html lang="en">
  <head>

    <title>Front View Fist</title>

    <main class="app" id="app">
      <section class="scene" aria-live="polite">
        <div class="flag" aria-hidden="true">
          <svg
            class="flag-svg"
            viewBox="0 0 1900 1000"
            preserveAspectRatio="xMidYMid slice"
          >
            <rect width="1900" height="1000" fill="#ffffff" />
            <rect width="1900" height="76.923" y="0" fill="#b22234" />
            <rect width="1900" height="76.923" y="153.846" fill="#b22234" />
            <rect width="1900" height="76.923" y="307.692" fill="#b22234" />
            <rect width="1900" height="76.923" y="461.538" fill="#b22234" />
            <rect width="1900" height="76.923" y="615.384" fill="#b22234" />
            <rect width="1900" height="76.923" y="769.23" fill="#b22234" />
            <rect width="1900" height="76.923" y="923.076" fill="#b22234" />
            <rect width="760" height="538.462" fill="#3c3b6e" />

            <g fill="#ffffff">
              <use href="#flag-star" transform="translate(63 58) scale(0.58)" />
              <use href="#flag-star" transform="translate(189 58) scale(0.58)" />
              <use href="#flag-star" transform="translate(315 58) scale(0.58)" />
              <use href="#flag-star" transform="translate(441 58) scale(0.58)" />
              <use href="#flag-star" transform="translate(567 58) scale(0.58)" />
              <use href="#flag-star" transform="translate(693 58) scale(0.58)" />

              <use href="#flag-star" transform="translate(126 112) scale(0.58)" />
              <use href="#flag-star" transform="translate(252 112) scale(0.58)" />

              <use href="#flag-star" transform="translate(630 112) scale(0.58)" />

              <use href="#flag-star" transform="translate(63 166) scale(0.58)" />
              <use href="#flag-star" transform="translate(189 166) scale(0.58)" />
              <use href="#flag-star" transform="translate(315 166) scale(0.58)" />
              <use href="#flag-star" transform="translate(441 166) scale(0.58)" />
              <use href="#flag-star" transform="translate(567 166) scale(0.58)" />
              <use href="#flag-star" transform="translate(693 166) scale(0.58)" />

              <use href="#flag-star" transform="translate(126 220) scale(0.58)" />
              <use href="#flag-star" transform="translate(252 220) scale(0.58)" />
              <use href="#flag-star" transform="translate(378 220) scale(0.58)" />
              <use href="#flag-star" transform="translate(504 220) scale(0.58)" />
              <use href="#flag-star" transform="translate(630 220) scale(0.58)" />

              <use href="#flag-star" transform="translate(63 274) scale(0.58)" />
              <use href="#flag-star" transform="translate(189 274) scale(0.58)" />
              <use href="#flag-star" transform="translate(315 274) scale(0.58)" />
              <use href="#flag-star" transform="translate(441 274) scale(0.58)" />
              <use href="#flag-star" transform="translate(567 274) scale(0.58)" />
              <use href="#flag-star" transform="translate(693 274) scale(0.58)" />

              <use href="#flag-star" transform="translate(126 328) scale(0.58)" />
              <use href="#flag-star" transform="translate(252 328) scale(0.58)" />
              <use href="#flag-star" transform="translate(378 328) scale(0.58)" />
              <use href="#flag-star" transform="translate(504 328) scale(0.58)" />
              <use href="#flag-star" transform="translate(630 328) scale(0.58)" />

              <use href="#flag-star" transform="translate(63 382) scale(0.58)" />
              <use href="#flag-star" transform="translate(189 382) scale(0.58)" />
              <use href="#flag-star" transform="translate(315 382) scale(0.58)" />
              <use href="#flag-star" transform="translate(441 382) scale(0.58)" />
              <use href="#flag-star" transform="translate(567 382) scale(0.58)" />
              <use href="#flag-star" transform="translate(693 382) scale(0.58)" />

              <use href="#flag-star" transform="translate(126 436) scale(0.58)" />
              <use href="#flag-star" transform="translate(252 436) scale(0.58)" />
              <use href="#flag-star" transform="translate(378 436) scale(0.58)" />
              <use href="#flag-star" transform="translate(504 436) scale(0.58)" />
              <use href="#flag-star" transform="translate(630 436) scale(0.58)" />

              <use href="#flag-star" transform="translate(63 490) scale(0.58)" />
              <use href="#flag-star" transform="translate(189 490) scale(0.58)" />
              <use href="#flag-star" transform="translate(315 490) scale(0.58)" />
              <use href="#flag-star" transform="translate(441 490) scale(0.58)" />

          <span class="flag-wave flag-wave-a"></span>
          <span class="flag-wave flag-wave-b"></span>
          <span class="flag-shadow"></span>
        </div>

        <div class="fireworks" aria-hidden="true">
          <span class="burst burst-a"></span>
          <span class="burst burst-b"></span>
          <span class="burst burst-c"></span>
          <span class="burst burst-d"></span>
        </div>

        <div class="arsenal" aria-hidden="true">
          <div class="fan fan-left fan-rear">
            <svg class="weapon-svg" viewBox="0 0 940 220">
              <use href="#mk18-rifle"></use>
            </svg>
          </div>
          <div class="fan fan-left fan-mid">
            <svg class="weapon-svg" viewBox="0 0 940 220">
              <use href="#mk18-rifle"></use>
            </svg>
          </div>
          <div class="fan fan-left fan-front">
            <svg class="weapon-svg" viewBox="0 0 940 220">
              <use href="#mk18-rifle"></use>
            </svg>
          </div>
          <div class="fan fan-right fan-rear">
            <svg class="weapon-svg" viewBox="0 0 940 220">
              <use href="#mk18-rifle"></use>
            </svg>
          </div>
          <div class="fan fan-right fan-mid">
            <svg class="weapon-svg" viewBox="0 0 940 220">
              <use href="#mk18-rifle"></use>
            </svg>
          </div>
          <div class="fan fan-right fan-front">
            <svg class="weapon-svg" viewBox="0 0 940 220">
              <use href="#mk18-rifle"></use>
            </svg>
          </div>

          <div class="missile patriot missile-left missile-rear">
            <svg class="missile-svg" viewBox="0 0 760 220">
              <use href="#patriot-missile"></use>
            </svg>
          </div>
          <div class="missile tomahawk missile-left missile-front">
            <svg class="missile-svg" viewBox="0 0 760 220">
              <use href="#tomahawk-missile"></use>
            </svg>
          </div>
          <div class="missile patriot missile-right missile-rear">
            <svg class="missile-svg" viewBox="0 0 760 220">
              <use href="#patriot-missile"></use>
            </svg>
          </div>
          <div class="missile tomahawk missile-right missile-front">
            <svg class="missile-svg" viewBox="0 0 760 220">
              <use href="#tomahawk-missile"></use>
            </svg>
          </div>

          <div class="tank tank-left">
            <svg class="tank-svg" viewBox="0 0 760 360">
              <use href="#bradley-ifv"></use>
            </svg>
          </div>
          <div class="tank tank-right">
            <svg class="tank-svg" viewBox="0 0 760 360">
              <use href="#bradley-ifv"></use>
            </svg>
          </div>
        </div>

        <div class="content">
          <button
            class="gesture-button"
            id="gestureButton"
            type="button"
            aria-label="Toggle the hand gesture"
            aria-pressed="false"
          >
            <span class="button-glow" aria-hidden="true"></span>
            <span class="hand-stage" aria-hidden="true">
              <span class="hand fist" id="hand">
                <span class="finger finger-index"></span>
                <span class="finger finger-middle"></span>
                <span class="finger finger-ring"></span>
                <span class="finger finger-pinky"></span>
                <span class="thumb"></span>
                <span class="palm"></span>
                <span class="wrist"></span>
                <span class="knuckles"></span>
              </span>
            </span>
          </button>

          <p class="hint" id="hint">click the fist</p>
          <h1 class="message" id="message">fuck you juan</h1>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
