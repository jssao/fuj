<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Front View Fist</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Black+Ops+One&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app" id="app">
      <section class="scene" aria-live="polite">
        <div class="flag" aria-hidden="true">
          <span class="star-field"></span>
        </div>

        <div class="fireworks" aria-hidden="true">
          <span class="burst burst-a"></span>
          <span class="burst burst-b"></span>
          <span class="burst burst-c"></span>
          <span class="burst burst-d"></span>
        </div>

        <div class="arsenal" aria-hidden="true">
          <div class="rifle rifle-left"></div>
          <div class="rifle rifle-right"></div>
          <div class="gatling gatling-left"></div>
          <div class="gatling gatling-right"></div>
          <div class="missile missile-left"></div>
          <div class="missile missile-right"></div>
          <div class="tank tank-left"></div>
          <div class="tank tank-right"></div>
        </div>

        <div class="content">
          <button
            class="gesture-button"
            id="gestureButton"
            type="button"
            aria-label="Toggle the hand gesture"
            aria-pressed="false"
          >
            <span class="button-glow" aria-hidden="true"></span>
            <svg
              class="hand-svg"
              viewBox="0 0 320 420"
              aria-hidden="true"
              role="img"
            >
              <defs>
                <linearGradient id="skinFill" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#f7c9a6" />
                  <stop offset="48%" stop-color="#df9a6d" />
                  <stop offset="100%" stop-color="#b7673b" />
                </linearGradient>
                <linearGradient id="skinShade" x1="0%" y1="0%" x2="0%" y2="100%">
                  <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28" />
                  <stop offset="100%" stop-color="#320e02" stop-opacity="0.24" />
                </linearGradient>
                <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="160%">
                  <feDropShadow
                    dx="0"
                    dy="16"
                    stdDeviation="12"
                    flood-color="#180600"
                    flood-opacity="0.28"
                  />
                </filter>
              </defs>

              <ellipse class="hand-shadow" cx="160" cy="386" rx="92" ry="18" />

              <g class="hand-core" filter="url(#dropShadow)">
                <g class="finger finger-index">
                  <rect class="skin" x="84" y="70" width="36" height="166" rx="18" />
                  <rect class="nail" x="92" y="82" width="20" height="10" rx="5" />
                </g>
                <g class="finger finger-middle">
                  <rect class="skin" x="126" y="56" width="36" height="182" rx="18" />
                  <rect class="nail" x="134" y="68" width="20" height="10" rx="5" />
                </g>
                <g class="finger finger-ring">
                  <rect class="skin" x="168" y="62" width="36" height="174" rx="18" />
                  <rect class="nail" x="176" y="74" width="20" height="10" rx="5" />
                </g>
                <g class="finger finger-pinky">
                  <rect class="skin" x="210" y="78" width="34" height="158" rx="17" />
                  <rect class="nail" x="217" y="90" width="18" height="10" rx="5" />
                </g>

                <rect class="skin wrist" x="115" y="294" width="90" height="112" rx="38" />
                <rect class="skin palm" x="70" y="146" width="182" height="190" rx="58" />
                <path
                  class="shadow-band"
                  d="M82 172c14-14 32-22 52-22h62c28 0 52 20 52 48v72c0 32-26 58-58 58H130c-34 0-60-28-60-62v-50c0-18 4-32 12-44Z"
                />
                <path
                  class="skin thumb"
                  d="M101 218c-31 6-58 31-58 64 0 40 43 62 88 45 16-6 24-12 32-18l-10-51c-16 11-28 17-46 18-20 2-32-6-32-19 0-16 18-30 42-32l18-1-10-18c-7-1-14-1-24 0Z"
                />
                <path
                  class="crease"
                  d="M118 235c20 13 49 15 82 5M108 272c28 11 66 11 104-2M154 165c13 20 13 39 0 58"
                />
              </g>
            </svg>
          </button>

          <p class="hint" id="hint">click the fist</p>
          <h1 class="message" id="message">fuck you juan</h1>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
