<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Front View Fist</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <button
        class="hand-button"
        id="handButton"
        type="button"
        aria-label="Toggle hand gesture"
      >
        <span class="hand fist" id="hand" aria-hidden="true">
          <span class="finger finger-index"></span>
          <span class="finger finger-middle"></span>
          <span class="finger finger-ring"></span>
          <span class="finger finger-pinky"></span>
          <span class="thumb"></span>
          <span class="palm"></span>
        </span>
      </button>

      <h1 class="message" id="message">fuck you juan</h1>
    </main>

    <script src="script.js"></script>
  </body>
</html>
