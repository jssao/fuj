<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Front View Fist</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Black+Ops+One&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app" id="app">
      <section class="scene" aria-live="polite">
        <div class="flag" aria-hidden="true">
          <span class="star-field"></span>
        </div>

        <div class="fireworks" aria-hidden="true">
          <span class="burst burst-a"></span>
          <span class="burst burst-b"></span>
          <span class="burst burst-c"></span>
          <span class="burst burst-d"></span>
        </div>

        <div class="arsenal" aria-hidden="true">
          <div class="fan fan-left fan-rear">
            <div class="weapon rifle compact"></div>
          </div>
          <div class="fan fan-left fan-mid">
            <div class="weapon gatling"></div>
          </div>
          <div class="fan fan-left fan-front">
            <div class="weapon rifle"></div>
          </div>
          <div class="fan fan-right fan-rear">
            <div class="weapon rifle compact"></div>
          </div>
          <div class="fan fan-right fan-mid">
            <div class="weapon gatling"></div>
          </div>
          <div class="fan fan-right fan-front">
            <div class="weapon rifle"></div>
          </div>
          <div class="missile missile-left missile-rear"></div>
          <div class="missile missile-left missile-front"></div>
          <div class="missile missile-right missile-rear"></div>
          <div class="missile missile-right missile-front"></div>
          <div class="tank tank-left"></div>
          <div class="tank tank-right"></div>
        </div>

        <div class="content">
          <button
            class="gesture-button"
            id="gestureButton"
            type="button"
            aria-label="Toggle the hand gesture"
            aria-pressed="false"
          >
            <span class="button-glow" aria-hidden="true"></span>
            <span class="hand-stage" aria-hidden="true">
              <span class="hand fist" id="hand">
                <span class="finger finger-index"></span>
                <span class="finger finger-middle"></span>
                <span class="finger finger-ring"></span>
                <span class="finger finger-pinky"></span>
                <span class="thumb"></span>
                <span class="palm"></span>
                <span class="wrist"></span>
                <span class="knuckles"></span>
              </span>
            </span>
          </button>

          <p class="hint" id="hint">click the fist</p>
          <h1 class="message" id="message">fuck you juan</h1>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
