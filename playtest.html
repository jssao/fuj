<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Santiago's Wrath — Playtest Sandbox</title>
    <style>
      :root { --bg:#15171a; --panel:#1d2024; --line:#2d3137; --txt:#e8e4da; --dim:#8b9099; --gold:#f8bf48; --accent:#65d5ff; --dmg:#ff8a5a; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--txt); font: 13px/1.4 ui-sans-serif, system-ui, -apple-system, sans-serif; }
      #app { display: flex; height: 100vh; width: 100vw; }
      #stage { flex: 1 1 auto; min-width: 0; position: relative; background: #000; }
      #game { width: 100%; height: 100%; border: 0; display: block; }
      #panel { flex: 0 0 360px; max-width: 42vw; height: 100%; overflow-y: auto; background: var(--panel); border-left: 1px solid var(--line); padding: 12px 12px 24px; }
      h1 { font-size: 14px; margin: 2px 0 6px; letter-spacing: 0.3px; }
      h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--dim); margin: 16px 0 6px; border-bottom: 1px solid var(--line); padding-bottom: 4px; }
      .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
      button { font: inherit; font-weight: 650; color: var(--txt); background: #262a30; border: 1px solid var(--line); border-radius: 7px; padding: 7px 9px; cursor: pointer; transition: transform 80ms ease, background 120ms ease; }
      button:hover { background: #2f343b; } button:active { transform: scale(0.95); }
      button.prime { background: var(--gold); color: #1a130a; border-color: var(--gold); }
      button.ghost { background: transparent; }
      .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
      .swatch { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: middle; box-shadow: 0 0 6px currentColor; }
      label.opt { display: inline-flex; align-items: center; gap: 5px; color: var(--dim); font-size: 12px; }
      input[type="number"] { width: 50px; } select, input[type="number"] { background: #262a30; border: 1px solid var(--line); color: var(--txt); border-radius: 6px; padding: 5px; font: inherit; }
      .mini { font-size: 10px; color: var(--dim); font-weight: 500; }
      .hint { font-size: 11px; color: var(--dim); margin: 4px 0 2px; }
      #status { font-size: 11px; color: var(--dim); margin-bottom: 6px; }
      #log { margin-top: 8px; background: #101215; border: 1px solid var(--line); border-radius: 8px; height: 230px; overflow-y: auto; padding: 6px 8px; font: 11px/1.45 ui-monospace, "SF Mono", Menlo, monospace; }
      .ev { white-space: pre-wrap; word-break: break-word; padding: 1px 0; border-bottom: 1px solid rgba(255,255,255,0.03); color: var(--dim); }
      .ev b { color: var(--txt); font-weight: 700; }
      .ev.cast { color: #ffe6a3; } .ev.cast b { color: var(--gold); }
      .ev.combo { color: #cfe2ff; } .ev.combo b { color: var(--accent); }
      .ev.dmg { color: var(--dmg); } .ev.dmg b { color: #ffb088; }
      .ev.kill { color: #ffb0a0; }
      .t { color: #5f6670; }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="stage"><iframe id="game" src="./santiago-wrath.html" tabindex="-1"></iframe></div>
      <div id="panel">
        <h1>🌀 Playtest Sandbox</h1>
        <div id="status">Loading game…</div>
        <div class="hint">Move / Q / E / Space are forwarded to the game even while you click here.</div>
        <div class="row">
          <button id="restart" class="prime">Restart</button>
          <button id="reset" class="ghost">Reset field</button>
        </div>

        <h2>Dummies</h2>
        <div class="row">
          <label class="opt">Count <input id="count" type="number" min="1" max="20" value="6" /></label>
          <label class="opt">Wave <input id="wave" type="number" min="1" max="999" value="15" /></label>
          <label class="opt">Type <select id="type"><option value="">Mixed</option></select></label>
          <button id="spawn">Spawn / refresh</button>
        </div>
        <div class="row" style="margin-top:6px">
          <label class="opt"><input id="invuln" type="checkbox" checked /> Invulnerable</label>
          <label class="opt"><input id="ai" type="checkbox" /> AI (seek + attack)</label>
          <label class="opt"><input id="hp" type="checkbox" checked /> Show HP</label>
        </div>
        <div class="row" style="margin-top:4px">
          <label class="opt"><input id="respawn" type="checkbox" checked /> Auto-respawn</label>
          <label class="opt"><input id="shake" type="checkbox" /> Colossus shake</label>
          <label class="opt"><input id="grade" type="checkbox" /> Cinematic look</label>
        </div>

        <h2>Elements (solo)</h2>
        <div id="elements" class="grid"></div>
        <h2>Combos (synergy)</h2>
        <div id="combos" class="grid"></div>
        <h2>Kill-streak specials</h2>
        <div id="streaks" class="grid"></div>

        <h2>Event log <span class="mini" id="logcount"></span></h2>
        <div class="row">
          <button id="clearlog" class="ghost">Clear</button>
          <button id="copylog" class="ghost">Copy</button>
          <label class="opt"><input id="autoscroll" type="checkbox" checked /> Auto-scroll</label>
        </div>
        <div id="log"></div>
      </div>
    </div>

    <script>
      const frame = document.getElementById("game");
      const $ = (id) => document.getElementById(id);
      const statusEl = $("status");
      let sb = null, lastSeq = 0, ready = false;
      const win = () => { try { return frame.contentWindow; } catch (e) { return null; } };
      const hook = () => { try { return win().__SANTIAGO_WRATH__ || null; } catch (e) { return null; } };

      function opts() {
        return {
          dummies: Math.max(1, Math.min(20, parseInt($("count").value, 10) || 6)),
          type: $("type").value || null,
          invuln: $("invuln").checked,
          ai: $("ai").checked,
          respawn: $("respawn").checked,
          shake: $("shake").checked,
          grade: $("grade").checked,
          wave: Math.max(1, Math.min(999, parseInt($("wave").value, 10) || 15)),
          hp: $("hp").checked,
        };
      }
      function safe(fn) { try { fn(); } catch (e) { console.warn(e); statusEl.textContent = "⚠ " + e.message; } }
      function applyOpts() { if (sb) safe(() => sb.setOpts(opts())); }
      function applyAndRespawn() { if (sb) safe(() => { sb.setOpts(opts()); sb.respawnDummies(); }); }

      function btn(label, color, onClick, sub) {
        const b = document.createElement("button");
        if (color != null) { const s = document.createElement("span"); s.className = "swatch"; s.style.color = "#" + color.toString(16).padStart(6, "0"); b.appendChild(s); }
        b.appendChild(document.createTextNode(label));
        if (sub) { const m = document.createElement("span"); m.className = "mini"; m.textContent = " " + sub; b.appendChild(m); }
        b.addEventListener("click", onClick);
        return b;
      }

      function buildControls() {
        const L = sb.lists();
        const typeSel = $("type");
        typeSel.innerHTML = '<option value="">Mixed</option>';
        L.enemyTypes.forEach((t) => { const o = document.createElement("option"); o.value = t.id; o.textContent = t.label; typeSel.appendChild(o); });
        const el = $("elements"); el.innerHTML = "";
        L.elements.forEach((e) => el.appendChild(btn(e.label, e.color, () => safe(() => sb.element(e.id)))));
        const co = $("combos"); co.innerHTML = "";
        L.combos.forEach((c) => co.appendChild(btn(c.name, c.color, () => safe(() => sb.combo(c.key)), c.key))); // sub-label = the RECIPE (several recipes share a result, e.g. water conducts -> Electric Field x3)
        const st = $("streaks"); st.innerHTML = "";
        L.streaks.forEach((s) => st.appendChild(btn(s.label, null, () => safe(() => sb.streak(s.id)), s.threshold ? "@" + s.threshold : "")));
      }

      // blur any panel button after click so Space/Q/E don't re-trigger it (they go to the game instead)
      $("panel").addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) b.blur(); });

      ["ai", "respawn", "shake", "grade", "hp"].forEach((id) => $(id).addEventListener("change", applyOpts));
      ["count", "type", "wave", "invuln"].forEach((id) => $(id).addEventListener("change", applyAndRespawn));
      $("restart").addEventListener("click", () => safe(() => sb.start(opts())));
      $("reset").addEventListener("click", () => { safe(() => sb.reset()); lastSeq = 0; $("log").innerHTML = ""; });
      $("spawn").addEventListener("click", applyAndRespawn);
      $("clearlog").addEventListener("click", () => { safe(() => sb.clearLog()); lastSeq = 0; $("log").innerHTML = ""; });
      $("copylog").addEventListener("click", async () => { const h = hook(); if (!h || !h.debug) return; try { await navigator.clipboard.writeText(JSON.stringify(h.debug.events, null, 2)); statusEl.textContent = "Log copied."; } catch (e) { statusEl.textContent = "Clipboard blocked."; } });

      // ---- forward movement / Q / E / Space to the game even when the panel has focus ----
      function forwardKey(e) {
        const t = e.target;
        if (t && (t.tagName === "INPUT" || t.tagName === "SELECT" || t.tagName === "TEXTAREA")) return; // let typing work
        const w = win(); if (!w) return;
        if (e.key === " " || e.key === "Spacebar" || e.key.indexOf("Arrow") === 0) e.preventDefault(); // no page scroll
        try { w.dispatchEvent(new w.KeyboardEvent(e.type, { key: e.key, code: e.code, keyCode: e.keyCode, which: e.which, bubbles: true, cancelable: true })); } catch (x) {}
      }
      document.addEventListener("keydown", forwardKey);
      document.addEventListener("keyup", forwardKey);

      const CLASS = { "combo-cast": "combo", "sandbox-combo": "combo", "sandbox-element": "cast", "sandbox-streak": "cast", "sandbox-damage": "dmg", "enemy-kill": "kill", "kill": "kill" };
      function renderLog() {
        const h = hook(); const logEl = $("log");
        if (!h || !h.debug || !h.debug.events) return;
        const evs = h.debug.events;
        for (const e of evs) {
          if (e.seq <= lastSeq) continue;
          const div = document.createElement("div");
          div.className = "ev " + (CLASS[e.type] || "");
          const d = e.data && Object.keys(e.data).length ? "  " + JSON.stringify(e.data) : "";
          div.innerHTML = '<span class="t">' + (e.at != null ? e.at.toFixed(1) + "s " : "") + "</span><b>" + e.type + "</b>" + d.replace(/</g, "&lt;");
          logEl.appendChild(div);
          lastSeq = Math.max(lastSeq, e.seq);
        }
        while (logEl.childNodes.length > 220) logEl.removeChild(logEl.firstChild);
        if ($("autoscroll").checked) logEl.scrollTop = logEl.scrollHeight;
        $("logcount").textContent = evs.length + " events";
      }

      function waitForSandbox() {
        const h = hook();
        if (h && h.sandbox && h.game) {
          sb = h.sandbox;
          if (!ready) { ready = true; statusEl.textContent = "Sandbox ready."; buildControls(); safe(() => sb.start(opts())); }
        } else { ready = false; sb = null; statusEl.textContent = "Waiting for game to load…"; }
        setTimeout(waitForSandbox, 400);
      }
      frame.addEventListener("load", () => { ready = false; sb = null; lastSeq = 0; $("log").innerHTML = ""; });
      waitForSandbox();
      setInterval(renderLog, 300);
    </script>
  </body>
</html>
