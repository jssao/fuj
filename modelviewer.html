<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mob & Boss Model Viewer</title>
    <style>
      html, body { margin: 0; height: 100%; background: #1c2024; overflow: hidden; }
      #info { position: fixed; left: 10px; top: 8px; color: #cfd4cc; font: 12px ui-monospace, Menlo, monospace; z-index: 5; pointer-events: none; text-shadow: 0 1px 3px #000; }
      #hint { position: fixed; right: 10px; top: 8px; color: #8b9099; font: 12px ui-monospace, Menlo, monospace; z-index: 5; pointer-events: none; }
      canvas.gl { display: block; cursor: grab; }
      canvas.gl.grabbing { cursor: grabbing; }
      #ruler { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 4; pointer-events: none; } /* explicit size: inset alone leaves an SVG at its 300x150 intrinsic default, silently clipping everything outside it */
      /* ---- single-model view panel ---- */
      #panel { position: fixed; right: 0; top: 0; bottom: 0; width: 300px; z-index: 6; overflow-y: auto; display: none;
               background: rgba(24,27,31,0.93); border-left: 1px solid #2d3137; color: #e8e4da; font: 12px/1.45 ui-monospace, Menlo, monospace; padding: 10px 12px 24px; }
      #panel h1 { font-size: 14px; margin: 2px 0 2px; }
      #panel h2 { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: #8b9099; margin: 14px 0 6px; border-bottom: 1px solid #2d3137; padding-bottom: 3px; }
      #panel .dim { color: #8b9099; font-size: 11px; }
      #panel button { font: inherit; color: #e8e4da; background: #262a30; border: 1px solid #2d3137; border-radius: 6px; padding: 4px 8px; cursor: pointer; margin: 2px 2px 2px 0; }
      #panel button:hover { background: #2f343b; }
      #panel button.on { background: #f8bf48; color: #1a130a; border-color: #f8bf48; }
      #panel label { display: flex; align-items: center; gap: 6px; margin: 3px 0; color: #cfd4cc; }
      #panel input[type="range"] { flex: 1; }
      #panel input[type="text"] { flex: 1; background: #101215; color: #e8e4da; border: 1px solid #2d3137; border-radius: 5px; padding: 3px 6px; font: inherit; }
      #panel .joint { padding: 2px 6px; border-radius: 5px; cursor: pointer; }
      #panel .joint.sel { background: #f8bf48; color: #1a130a; }
      #texprev { width: 100%; border: 1px solid #2d3137; border-radius: 6px; image-rendering: pixelated; background: #111; }
      #back { position: fixed; left: 10px; top: 28px; z-index: 6; display: none; font: 12px ui-monospace, Menlo, monospace;
              color: #e8e4da; background: #262a30; border: 1px solid #2d3137; border-radius: 6px; padding: 5px 10px; cursor: pointer; }
      #rigjson { width: 100%; height: 80px; background: #101215; color: #cfd4cc; border: 1px solid #2d3137; border-radius: 6px; font: 10px ui-monospace, Menlo, monospace; }
    </style>
    <script type="importmap">
      { "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"
      } }
    </script>
  </head>
  <body>
    <div id="info">loading…</div>
    <div id="hint">drag a model to rotate · CLICK a model to inspect it</div>
    <svg id="ruler"></svg>
    <button id="back">← all models (Esc)</button>
    <div id="panel"></div>
    <script type="module">
      import * as THREE from "three";
      import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";
      import { TransformControls } from "three/addons/controls/TransformControls.js";
      import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
      import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
      import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";

      // [file, label, glowKey] — two rows of 8 (mobs+shield, then rest+bosses)
      const ROWS = [
        [
          ["ash_dead.glb", "basic", null], ["crawler.glb", "crawler", null], ["hugger.glb", "hugger", null], ["ranged.glb", "ranged", null],
          ["stalker.glb", "stalker", null], ["lurker.glb", "lurker", "lurker"], ["brute.glb", "brute", null], ["wisp.glb", "wisp", "wisp"],
        ],
        [
          ["bursar.glb", "bursar", "bursar"], ["spitter.glb", "spitter", null], ["shield.glb", "Bulwark", null], ["boss-tyrant.glb", "Grave Tyrant", null],
          ["boss-warden.glb", "Rune Warden", "warden"], ["boss-alpha.glb", "Pack Alpha", null], ["boss-conduit.glb", "Hex Conduit", null], ["boss-colossus.glb", "Crown Colossus", null],
          ["santiago.glb", "Santiago", null, "./"], // the PLAYER (lives at game/, not mobs/; entry[3] = dir override — kid GLBs slot in the same way when they exist)
        ],
      ];
      // emissive color-key glow (replicated from the game's MOB_GLOW)
      const GLOW = {
        lurker: { color: 0xb14cff, intensity: 2.0, hueC: 0.967, hueW: 0.06, satMin: 0.28, valMin: 0.35 },
        wisp:   { color: 0x3ad8ff, intensity: 1.9, hueC: 0.5,   hueW: 1.0,  satMin: 0.0,  valMin: 0.55 },
        bursar: { color: 0xff7a18, intensity: 2.0, hueC: 0.075, hueW: 0.08, satMin: 0.5,  valMin: 0.32 },
        warden: { color: 0x4fd8ff, intensity: 1.8, hueC: 0.52,  hueW: 0.10, satMin: 0.45, valMin: 0.42 }, // cyan rune-rods (sat+val keyed -> excludes the desaturated stone body)
      };
      const TARGET_H = 2.1, SPACING = 3.0, ROW_Y = 3.4;
      // Default-yaw flip (viewer only — gameplay orients these itself). These GLBs face away from the camera natively.
      const FLIP = { "boss-conduit.glb": true };
      const SCALE = { "stalker.glb": [1.95, 1, 1], "hugger.glb": [1, 1, 1.15], "boss-tyrant.glb": [1, 1, 1.2] }; // non-uniform pre-fit scale — thicken thin axes (stalker X; hugger +15% & tyrant +20% on Z = profile)

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x1c2024);
      scene.fog = new THREE.Fog(0x1c2024, 34, 80);
      const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 200);
      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(Math.min(2, devicePixelRatio));
      renderer.setSize(innerWidth, innerHeight);
      renderer.domElement.className = "gl";
      document.body.appendChild(renderer.domElement);

      const composer = new EffectComposer(renderer);
      const renderPass = new RenderPass(scene, camera);
      composer.addPass(renderPass);
      const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.7, 0.5, 0.82);
      composer.addPass(bloom);

      scene.add(new THREE.HemisphereLight(0xffffff, 0x44484a, 2.0));
      const key = new THREE.DirectionalLight(0xffffff, 1.5); key.position.set(5, 10, 8); scene.add(key);
      const rim = new THREE.DirectionalLight(0x90b0ff, 0.6); rim.position.set(-6, 5, -8); scene.add(rim);
      const floor = new THREE.Mesh(new THREE.PlaneGeometry(140, 60), new THREE.MeshStandardMaterial({ color: 0x282d33, roughness: 1 }));
      floor.rotation.x = -Math.PI / 2; scene.add(floor);
      scene.add(new THREE.GridHelper(140, 70, 0x404a5a, 0x333842));
      const shelf = new THREE.Mesh(new THREE.BoxGeometry(60, 0.15, 4), new THREE.MeshStandardMaterial({ color: 0x282d33, roughness: 1 }));
      shelf.position.set(0, 3.3, -0.9); scene.add(shelf); // platform under the top row

      function applyGlow(root, g) {
        root.traverse((o) => {
          if (!o.isMesh || !o.material) return;
          (Array.isArray(o.material) ? o.material : [o.material]).forEach((m) => {
            if (m.emissive && m.emissive.setHex) m.emissive.setHex(0x000000);
            m.toneMapped = false; m.userData.glowBase = g.intensity;
            m.onBeforeCompile = (sh) => {
              sh.uniforms.uGlowTint = { value: new THREE.Color(g.color) }; sh.uniforms.uGlowI = { value: g.intensity };
              sh.uniforms.uHueC = { value: g.hueC }; sh.uniforms.uHueW = { value: g.hueW }; sh.uniforms.uSatMin = { value: g.satMin }; sh.uniforms.uValMin = { value: g.valMin };
              sh.fragmentShader = sh.fragmentShader
                .replace("#include <common>", "#include <common>\nuniform vec3 uGlowTint; uniform float uGlowI; uniform float uHueC; uniform float uHueW; uniform float uSatMin; uniform float uValMin;\nvec3 _rgb2hsv(vec3 c){vec4 K=vec4(0.,-1./3.,2./3.,-1.);vec4 p=mix(vec4(c.bg,K.wz),vec4(c.gb,K.xy),step(c.b,c.g));vec4 q=mix(vec4(p.xyw,c.r),vec4(c.r,p.yzx),step(p.x,c.r));float d=q.x-min(q.w,q.y);return vec3(abs(q.z+(q.w-q.y)/(6.*d+1e-10)),d/(q.x+1e-10),q.x);}")
                .replace("#include <emissivemap_fragment>", "vec3 _h=_rgb2hsv(diffuseColor.rgb);float _hd=abs(_h.x-uHueC);_hd=min(_hd,1.-_hd);float _m=step(_hd,uHueW)*step(uSatMin,_h.y)*step(uValMin,_h.z);totalEmissiveRadiance=uGlowTint*uGlowI*_m;");
              m.userData.glowUniforms = sh.uniforms;
            };
            m.needsUpdate = true;
          });
        });
      }

      // ---- Hex Conduit two-band self-illumination (single mesh/texture -> all HSV-keyed from albedo) ----
      const CONDUIT_FX = { glowI: 1.0, orange: 0xff7a18, orangeI: 2.2, vein: 0xffe8c0, cyan: 0x4fe0ff, cyanI: 2.0, cyanValMin: 0.40, capeTransp: 0.70 };
      const CONDUIT_COMMON =
        "#include <common>\n" +
        "uniform float uGlowI; uniform vec3 uOrange; uniform float uOrangeI; uniform vec3 uVein;\n" +
        "uniform vec3 uCyan; uniform float uCyanI; uniform float uCyanValMin; uniform float uCapeTransp;\n" +
        "vec3 _hsvC(vec3 c){vec4 K=vec4(0.,-1./3.,2./3.,-1.);vec4 p=mix(vec4(c.bg,K.wz),vec4(c.gb,K.xy),step(c.b,c.g));vec4 q=mix(vec4(p.xyw,c.r),vec4(c.r,p.yzx),step(p.x,c.r));float d=q.x-min(q.w,q.y);return vec3(abs(q.z+(q.w-q.y)/(6.*d+1e-10)),d/(q.x+1e-10),q.x);}";
      const CONDUIT_EMISSIVE =
        "#include <emissivemap_fragment>\n" +
        "{ vec3 _hsv=_hsvC(diffuseColor.rgb); float H=_hsv.x, S=_hsv.y, V=_hsv.z;\n" +
        "  float hdO=abs(H-0.07); hdO=min(hdO,1.0-hdO);\n" +
        "  float maskO=smoothstep(0.10,0.045,hdO)*smoothstep(0.26,0.44,S);\n" +
        "  float vein=smoothstep(0.60,0.85,V);\n" +
        "  vec3 tintO=mix(uOrange,uVein,vein*0.45);\n" +
        "  float intO=uOrangeI*(0.55+0.90*V)*(1.0+vein*0.25);\n" +
        "  float hdC=abs(H-0.54); hdC=min(hdC,1.0-hdC);\n" +
        "  float maskC=smoothstep(0.14,0.05,hdC)*smoothstep(uCyanValMin-0.12,uCyanValMin+0.10,V);\n" +
        "  float intC=uCyanI*(0.50+0.90*V);\n" +
        "  float blueGate=step(0.42,H)*step(H,0.74);\n" +
        "  float pale=smoothstep(0.30,0.12,S)*smoothstep(0.45,0.72,V)*blueGate;\n" +
        "  totalEmissiveRadiance += (tintO*intO*maskO + uCyan*intC*maskC*(1.0-0.4*pale))*uGlowI;\n" +
        "  diffuseColor.a *= 1.0 - uCapeTransp*pale; }";
      function applyConduitFX(root) {
        root.traverse((o) => {
          if (!o.isMesh || !o.material) return;
          (Array.isArray(o.material) ? o.material : [o.material]).forEach((m) => {
            if (m.emissive && m.emissive.setHex) m.emissive.setHex(0x000000);
            m.toneMapped = false; m.transparent = true; m.depthWrite = true; m.userData.glowBase = CONDUIT_FX.glowI;
            m.onBeforeCompile = (sh) => {
              sh.uniforms.uGlowI = { value: CONDUIT_FX.glowI };
              sh.uniforms.uOrange = { value: new THREE.Color(CONDUIT_FX.orange) }; sh.uniforms.uOrangeI = { value: CONDUIT_FX.orangeI };
              sh.uniforms.uVein = { value: new THREE.Color(CONDUIT_FX.vein) };
              sh.uniforms.uCyan = { value: new THREE.Color(CONDUIT_FX.cyan) }; sh.uniforms.uCyanI = { value: CONDUIT_FX.cyanI };
              sh.uniforms.uCyanValMin = { value: CONDUIT_FX.cyanValMin }; sh.uniforms.uCapeTransp = { value: CONDUIT_FX.capeTransp };
              sh.fragmentShader = sh.fragmentShader.replace("#include <common>", CONDUIT_COMMON).replace("#include <emissivemap_fragment>", CONDUIT_EMISSIVE);
              m.userData.glowUniforms = sh.uniforms;
            };
            m.needsUpdate = true;
          });
        });
      }

      // ---- Generic albedo FX (HSV-keyed): emissive band + darken band + fade-to-transparent band. Mirrors the game. ----
      const MOB_FX_FILE = {
        "lurker.glb":  { emi: { c: 0x9a3cff, i: 2.4, hc: 0.967, hw: 0.06, smin: 0.28, vmin: 0.35 }, dark: { a: 0.20, hc: 0.80, hw: 0.10, smin: 0.20, vmax: 0.45 }, fade: { a: 0.60, hc: 0.80, hw: 0.16, vmin: 0.50, smax: 0.40 } },
        "spitter.glb": { dark: { a: 0.20, hc: 0.55, hw: 0.13, smin: 0.18, vmax: 1.0 } },
      };
      const MOBFX_COMMON =
        "#include <common>\n" +
        "uniform float uGlowI; uniform vec3 uEmi; uniform float uEmiI,uEmiHc,uEmiHw,uEmiSmin,uEmiVmin;\n" +
        "uniform float uDark,uDarkHc,uDarkHw,uDarkSmin,uDarkVmax;\n" +
        "uniform float uFade,uFadeHc,uFadeHw,uFadeVmin,uFadeSmax;\n" +
        "vec3 _hsvF(vec3 c){vec4 K=vec4(0.,-1./3.,2./3.,-1.);vec4 p=mix(vec4(c.bg,K.wz),vec4(c.gb,K.xy),step(c.b,c.g));vec4 q=mix(vec4(p.xyw,c.r),vec4(c.r,p.yzx),step(p.x,c.r));float d=q.x-min(q.w,q.y);return vec3(abs(q.z+(q.w-q.y)/(6.*d+1e-10)),d/(q.x+1e-10),q.x);}";
      const MOBFX_EMISSIVE =
        "#include <emissivemap_fragment>\n" +
        "{ vec3 _h=_hsvF(diffuseColor.rgb); float H=_h.x, S=_h.y, V=_h.z;\n" +
        "  float ehd=abs(H-uEmiHc); ehd=min(ehd,1.0-ehd);\n" +
        "  float em=step(ehd,uEmiHw)*step(uEmiSmin,S)*step(uEmiVmin,V);\n" +
        "  totalEmissiveRadiance += uEmi*uEmiI*em*uGlowI;\n" +
        "  float dhd=abs(H-uDarkHc); dhd=min(dhd,1.0-dhd);\n" +
        "  float dm=step(dhd,uDarkHw)*step(uDarkSmin,S)*step(V,uDarkVmax);\n" +
        "  diffuseColor.rgb *= 1.0 - uDark*dm;\n" +
        "  float fhd=abs(H-uFadeHc); fhd=min(fhd,1.0-fhd);\n" +
        "  float fm=step(fhd,uFadeHw)*step(uFadeVmin,V)*step(S,uFadeSmax);\n" +
        "  diffuseColor.a *= 1.0 - uFade*fm; }";
      function applyMobFX(root, cfg) {
        const emi = cfg.emi || {}, dk = cfg.dark || {}, fd = cfg.fade || {};
        root.traverse((o) => {
          if (!o.isMesh || !o.material) return;
          (Array.isArray(o.material) ? o.material : [o.material]).forEach((m) => {
            if (m.emissive && m.emissive.setHex) m.emissive.setHex(0x000000);
            if (emi.i) m.toneMapped = false;
            if (fd.a) { m.transparent = true; m.depthWrite = true; }
            m.userData.glowBase = 1.0;
            m.onBeforeCompile = (sh) => {
              sh.uniforms.uGlowI = { value: 1.0 };
              sh.uniforms.uEmi = { value: new THREE.Color(emi.c || 0xffffff) }; sh.uniforms.uEmiI = { value: emi.i || 0 };
              sh.uniforms.uEmiHc = { value: emi.hc || 0 }; sh.uniforms.uEmiHw = { value: emi.hw || 0 }; sh.uniforms.uEmiSmin = { value: emi.smin || 0 }; sh.uniforms.uEmiVmin = { value: emi.vmin || 0 };
              sh.uniforms.uDark = { value: dk.a || 0 }; sh.uniforms.uDarkHc = { value: dk.hc || 0 }; sh.uniforms.uDarkHw = { value: dk.hw || 0 }; sh.uniforms.uDarkSmin = { value: dk.smin || 0 }; sh.uniforms.uDarkVmax = { value: dk.vmax || 1 };
              sh.uniforms.uFade = { value: fd.a || 0 }; sh.uniforms.uFadeHc = { value: fd.hc || 0 }; sh.uniforms.uFadeHw = { value: fd.hw || 0 }; sh.uniforms.uFadeVmin = { value: fd.vmin || 0 }; sh.uniforms.uFadeSmax = { value: fd.smax || 1 };
              sh.fragmentShader = sh.fragmentShader.replace("#include <common>", MOBFX_COMMON).replace("#include <emissivemap_fragment>", MOBFX_EMISSIVE);
              m.userData.glowUniforms = sh.uniforms;
            };
            m.needsUpdate = true;
          });
        });
      }

      // ---- Ranged wraith: a thin emissive ARROW (vertical, pointing down) in front of the body. Mirrors the game. ----
      const RANGED_FX = { glow: 0x8fd0ff, intensity: 2.2, arrow: { len: 0.80, rad: 0.007, pos: [0, 0.0, 0.22], rot: [0, 0, 0] } };
      function addRangedAccents(root) {
        const C = RANGED_FX, L = C.arrow.len, R = C.arrow.rad;
        const m = new THREE.MeshStandardMaterial({ color: 0x000000, emissive: new THREE.Color(C.glow), emissiveIntensity: C.intensity, roughness: 1, metalness: 0, toneMapped: false });
        const shaft = new THREE.Mesh(new THREE.CylinderGeometry(R, R, L * 0.8, 6), m);
        const tip = new THREE.Mesh(new THREE.ConeGeometry(R * 2.6, L * 0.20, 8), m); tip.rotation.x = Math.PI; tip.position.y = -L * 0.5; // apex points DOWN
        const arrow = new THREE.Group(); arrow.add(shaft); arrow.add(tip);
        arrow.position.set(C.arrow.pos[0], C.arrow.pos[1], C.arrow.pos[2]); arrow.rotation.set(C.arrow.rot[0], C.arrow.rot[1], C.arrow.rot[2]); root.add(arrow);
      }
      // ---- Pack Alpha: a small red emissive EYE on the face (face is at +Z). Mirrors the game. ----
      const ALPHA_FX = { eye: 0xff2412, intensity: 2.6, r: 0.030, pos: [0, 0.06, 0.40] };
      function addAlphaEye(root) {
        const C = ALPHA_FX;
        const m = new THREE.MeshStandardMaterial({ color: 0x000000, emissive: new THREE.Color(C.eye), emissiveIntensity: C.intensity, roughness: 1, metalness: 0, toneMapped: false });
        const eye = new THREE.Mesh(new THREE.SphereGeometry(C.r, 14, 12), m);
        eye.position.set(C.pos[0], C.pos[1], C.pos[2]); root.add(eye);
      }
      function applyFXFor(file, glowKey, root) { // one entry point shared by grid + single view
        root.traverse((o) => { if (o.isMesh && o.material) (Array.isArray(o.material) ? o.material : [o.material]).forEach((mm) => { if (mm.metalness !== undefined) mm.metalness = 0; if (mm.roughness !== undefined) mm.roughness = 0.85; mm.needsUpdate = true; }); }); // GLBs default to metalness=1 -> force diffuse
        if (file === "boss-conduit.glb") applyConduitFX(root);
        else if (MOB_FX_FILE[file]) applyMobFX(root, MOB_FX_FILE[file]);
        else if (glowKey && GLOW[glowKey]) applyGlow(root, GLOW[glowKey]);
        if (file === "ranged.glb") addRangedAccents(root);
        if (file === "boss-alpha.glb") addAlphaEye(root);
      }

      function label(text, x, y) {
        const c = document.createElement("canvas"); c.width = 256; c.height = 64;
        const g = c.getContext("2d"); g.fillStyle = "#e8e4da"; g.font = "bold 24px monospace"; g.textAlign = "center";
        g.fillText(text, 128, 42);
        const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), transparent: true, depthTest: false }));
        sp.scale.set(2.8, 0.7, 1); sp.position.set(x, y + TARGET_H + 0.4, 0); scene.add(sp);
      }

      const pivots = [];
      const loader = new GLTFLoader();
      let done = 0, total = 0; ROWS.forEach((r) => (total += r.length));

      ROWS.forEach((row, ri) => {
        const y = ri === 0 ? 0 : ROW_Y; // bottom row on the floor, top row stacked above
        const startX = -((row.length - 1) / 2) * SPACING;
        row.forEach(([file, lbl, glowKey, dir], ci) => {
          const x = startX + ci * SPACING;
          label(lbl, x, y);
          loader.load((dir || "./mobs/") + file, (gltf) => {
            const root = gltf.scene;
            if (SCALE[file]) { const s3 = SCALE[file]; root.scale.set(root.scale.x * s3[0], root.scale.y * s3[1], root.scale.z * s3[2]); } // thicken thin axes before fit/center
            const box = new THREE.Box3().setFromObject(root), size = new THREE.Vector3(), center = new THREE.Vector3();
            box.getSize(size); box.getCenter(center);
            const s = TARGET_H / (Math.max(size.x, size.y, size.z) || 1); // fit the LARGEST dim -> long/flat models (crawler) don't overflow their cell
            root.position.set(-center.x, -center.y + size.y / 2, -center.z);
            applyFXFor(file, glowKey, root);
            const inner = new THREE.Group(); inner.add(root); inner.scale.setScalar(s);
            const pivot = new THREE.Group(); pivot.add(inner); pivot.position.set(x, y, 0); pivot.rotation.y = FLIP[file] ? Math.PI : 0;
            pivot.userData.pivot = true; pivot.userData.file = file; pivot.userData.lbl = lbl; pivot.userData.glowKey = glowKey; pivot.userData.dir = dir; // click -> single view
            scene.add(pivot); pivots.push(pivot);
            done += 1; document.getElementById("info").textContent = `${done}/${total} loaded · each cell fits ${TARGET_H}u · click a model to inspect`;
            window.__viewerReady = done === total;
          }, undefined, (err) => { document.getElementById("info").textContent = "ERR " + file; });
        });
      });

      function frame() {
        const maxCols = Math.max(...ROWS.map((r) => r.length));
        const halfW = ((maxCols - 1) / 2) * SPACING + 2.9;    // row half-width + model margin + SVG ruler gutter (left)
